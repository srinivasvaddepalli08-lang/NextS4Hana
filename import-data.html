<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>NextS4HANA - Import data</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#00aeef;margin:0;min-height:100vh;display:grid;place-items:center}
.c{background:#fff;border-radius:18px;padding:28px;max-width:440px;width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.2)}
h1{margin:0 0 8px;font-size:22px;color:#0b2f55}p{color:#33475b;line-height:1.5}button{background:#0b4f8f;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer;width:100%;margin-top:12px}
button:disabled{opacity:.5}#m{margin-top:14px;font-weight:600}</style></head>
<body><div class="c"><h1>Import your data</h1>
<p>Choose <b>nexts4hana-data.json</b>. It is read in this browser only and is not uploaded anywhere. Existing data with the same IDs is replaced, including the sign-in account, so afterwards use your original login.</p>
<input type="file" id="f" accept=".json,application/json"><button id="b" disabled>Import</button><div id="m"></div></div>
<script>
var KEY='nexts4hana-db',f=document.getElementById('f'),b=document.getElementById('b'),m=document.getElementById('m'),data=null;
f.onchange=function(){var r=new FileReader();r.onload=function(){try{data=JSON.parse(r.result);if(!data||typeof data!=='object'||Array.isArray(data))throw 0;b.disabled=false;m.textContent=Object.keys(data).length+' records ready.'}catch(e){data=null;b.disabled=true;m.textContent='This is not a valid data file.'}};if(f.files[0])r.readAsText(f.files[0])};
b.onclick=function(){try{var cur=JSON.parse(localStorage.getItem(KEY)||'{}')||{};Object.assign(cur,data);localStorage.setItem(KEY,JSON.stringify(cur));m.textContent='Done. Opening the app...';setTimeout(function(){location.href='./'},1200)}catch(e){m.textContent='Could not save: '+e.message}};
</script></body></html>
